[project]
name = "features"
version = "0.1.0"
authors = [
    { name = "oceanraven", email = "oceanraven71@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pytorch-triton-xpu>=3.5.0",
    "requests>=2.34.2",
    "sae-lens>=6.54.12",
    "torch>=2.9.1",
    "transformer-lens<4",
]

[tool.uv.sources]
torch = [{ index = "pytorch-xpu" }]
pytorch-triton-xpu = [{ index = "pytorch-xpu" }]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
